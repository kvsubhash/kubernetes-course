apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-portal
  namespace: grade-submission
spec:
  replicas: 1
  selector:
    matchLabels:
      com.example.learning/instance: grade-submission-portal
  template:
    metadata:
      labels:
        com.example.learning/name: grade-submission
        com.example.learning/component: frontend
        com.example.learning/instance: grade-submission-portal
    spec:
      containers:
      - name: grade-submission-portal
        image: rslim087/kubernetes-course-grade-submission-portal
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: 5001
          initialDelaySeconds: 20
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: "readyz"
            port: 5001
          initialDelaySeconds: 20 #not mandatorially required
          periodSeconds: 5
        env: 
          - name: GRADE_SERVICE_HOST
            value: grade-submission-api
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "128Mi"
        ports:
          - containerPort: 5001
